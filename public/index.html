
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TalkSmart Chatbot</title>
  <style>
    #chatbox { width: 300px; height: 400px; border: 1px solid #ccc; padding: 10px; overflow-y: auto; }
    #input { width: 80%; }
  </style>
</head>
<body>
  <h3>Ask me anything about your dream home!</h3>
  <div id="chatbox"></div>
  <input type="text" id="input" placeholder="Type here..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    async function sendMessage() {
      const input = document.getElementById("input").value;
      const chatbox = document.getElementById("chatbox");

      chatbox.innerHTML += `<div><strong>You:</strong> ${input}</div>`;

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: input }),
      });

      const data = await response.json();
      chatbox.innerHTML += `<div><strong>Bot:</strong> ${data.reply}</div>`;
      document.getElementById("input").value = "";
    }
  </script>
</body>
</html>
